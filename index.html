.dlg{width:100%;max-height:100%;overflow-y:auto;touch-action:pan-y;background:var(--p1);box-shadow:0 -4px 0 0 #000,0 4px 0 0 #000,-4px 0 0 0 #000,4px 0 0 0 #000,inset 0 4px 0 0 rgba(255,255,255,.06);padding:16px 14px;animation:pop .22s cubic-bezier(.3,1.6,.6,1)}

.rw{display:flex;justify-content:space-between;font-size:8px;padding:7px 2px;border-bottom:2px dashed #26262f;opacity:0;animation:rowin .3s forwards}
.rw span:last-child{color:var(--gold)}
@keyframes rowin{from{opacity:0;transform:translateX(-20px)}to{opacity:1;transform:none}}
.bigtitle{font-size:26px;text-align:center;text-shadow:4px 4px 0 #000;margin:4px 0 8px;animation:slam .45s cubic-bezier(.3,1.8,.5,1)}
@keyframes slam{from{transform:scale(2.4) rotate(-6deg);opacity:0}}
.tog{display:flex;align-items:center;justify-content:space-between;font-size:9px;padding:10px 4px;border-bottom:2px solid #22222c}
.sw2{width:46px;height:24px;background:#2a2a36;box-shadow:0 0 0 2px #000;position:relative}
.sw2 i{position:absolute;top:3px;left:3px;width:18px;height:18px;background:#777;transition:left .12s}

input.name{font-family:inherit;font-size:14px;width:100%;padding:12px;background:#000;color:var(--gold);border:0;box-shadow:inset 0 0 0 3px #3a3a4c;text-align:center;text-transform:uppercase;outline:none;-webkit-user-select:text;user-select:text}

.lo{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:6px 0}

.bracket{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;font-size:6px}
.bracket .c{display:flex;flex-direction:column;justify-content:space-around;gap:6px}
.bracket .e{padding:6px 4px;background:#0e0e14;box-shadow:0 0 0 2px #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bracket .e.me{color:var(--gold);box-shadow:0 0 0 2px #000,0 0 0 4px var(--gold)}
.bracket .e.out{opacity:.35;text-decoration:line-through}

.vs{position:absolute;inset:0;overflow:hidden;background:#000;z-index:30}
.vs .half{position:absolute;top:0;bottom:0;width:62%;display:flex;flex-direction:column;align-items:center;justify-content:center}
.vs .l{left:0;background:linear-gradient(135deg,#123a7a,#081830);clip-path:polygon(0 0,100% 0,62% 100%,0 100%);animation:inL .35s ease-out}
.vs .r{right:0;background:linear-gradient(135deg,#7a1218,#300808);clip-path:polygon(38% 0,100% 0,100% 100%,0 100%);animation:inR .35s ease-out}
@keyframes inL{from{transform:translateX(-100%)}}@keyframes inR{from{transform:translateX(100%)}}
.vs .half img{width:62%;max-width:230px;image-rendering:pixelated;filter:drop-shadow(6px 6px 0 rgba(0,0,0,.5))}

.vs .l .nm{margin-right:24%;margin-top:4px}.vs .r .nm{margin-left:24%}
.vs .vsx{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);font-size:58px;color:var(--gold);text-shadow:5px 5px 0 #000,-3px -3px 0 #000;animation:slam .5s .25s both cubic-bezier(.3,1.8,.5,1)}
.vs .talk{position:absolute;left:8%;right:8%;bottom:calc(env(safe-area-inset-bottom) + 8%);text-align:center;font-size:9px;line-height:1.8;background:#fff;color:#111;padding:12px;box-shadow:0 0 0 3px #000;animation:fadein .3s .6s both}

/* TOASTS */
#toasts{z-index:40;display:flex;flex-direction:column;align-items:center;padding-top:calc(env(safe-area-inset-top) + 64px);gap:8px}

.toast img{width:28px;height:28px}

@keyframes tin{from{transform:translateY(-60px);opacity:0}}@keyframes tout{to{transform:translateY(-60px);opacity:0}}
/* TITLE */
.title{display:flex;flex-direction:column;align-items:center;justify-content:space-between;height:100%;padding:calc(env(safe-area-inset-top) + 9vh) 16px calc(env(safe-area-inset-bottom) + 6vh);background:linear-gradient(180deg,rgba(0,0,0,.65),rgba(0,0,0,.1) 40%,rgba(0,0,0,.75))}

.logo .c{font-size:8px;color:#fff;margin-top:22px;text-shadow:2px 2px 0 #000;letter-spacing:2px}
.blink{animation:blink 1s steps(2) infinite}@keyframes blink{50%{opacity:.25}}
.confetti{position:absolute;width:8px;height:8px;top:-10px;animation:fall linear forwards;z-index:25;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.tipbox{font-size:7px;line-height:1.8;color:#cfe8ff;background:#0e1a2a;padding:10px;box-shadow:0 0 0 2px #000;margin-top:10px}

const _iconCache = {};
function iconUrl(name) {
  if (_iconCache[name]) return _iconCache[name];

  _iconCache[name] = c.toDataURL(); return _iconCache[name];
}
function iconCanvas(name) {
  const k = 'c_' + name; if (_iconCache[k]) return _iconCache[k];
  const img = new Image(); img.src = iconUrl(name); _iconCache[k] = img; return img;
}

/* ═══════════════════════════════════════════════════════════════
   03 ARENAS: 5 hand-painted (procedural) pixel arenas, crowd,
   lighting overlays, ambient particles.
   World: arena center (0,0). Texel = 2 world units.
   ═══════════════════════════════════════════════════════════════ */
const FCR = 122;                 // fight ring radius (world)
const BG_X0 = -260, BG_Y0 = -385, BG_TW = 260, BG_TH = 500; // texel canvas
const TCX = 130, TCY = 192;      // arena center in texels

function painter(seed) {
  const [c, g] = newCanvas(BG_TW, BG_TH);
  const rng = mkR(seed);
  const T = {
    c, g, rng,
    R(x, y, w, h, col) { g.fillStyle = col; g.fillRect(x | 0, y | 0, w | 0, h | 0); },
    P(x, y, col) { g.fillStyle = col; g.fillRect(x | 0, y | 0, 1, 1); },
    noise(x, y, w, h, base, amp, chance = 1) {
      const [r, gg, b] = hex2rgb(base);
      for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) {
        if (rng() > chance) continue; const d = (rng() - 0.5) * 2 * amp;
        g.fillStyle = `rgb(${r + d | 0},${gg + d | 0},${b + d | 0})`; g.fillRect(x + i, y + j, 1, 1);
      }
    },
    specks(x, y, w, h, cols, n) { for (let k = 0; k < n; k++) { g.fillStyle = cols[Math.floor(rng() * cols.length)]; g.fillRect(x + Math.floor(rng() * w), y + Math.floor(rng() * h), 1, 1); } },
    disc(cx, cy, r, col, ry) { ry = ry || r; g.fillStyle = col; for (let j = -Math.ceil(ry); j <= ry; j++) { const w = Math.floor(r * Math.sqrt(Math.max(0, 1 - (j * j) / (ry * ry)))); g.fillRect(Math.round(cx - w), Math.round(cy + j), w * 2 + 1, 1); } },
    ring(cx, cy, r, col, gap = 0, th = 1) { g.fillStyle = col; const n = Math.ceil(r * 7); for (let k = 0; k < n; k++) { if (gap && (k % gap) < gap / 2) continue; const a = k / n * Math.PI * 2; for (let t = 0; t < th; t++) g.fillRect(Math.round(cx + Math.cos(a) * (r - t)), Math.round(cy + Math.sin(a) * (r - t)), 1, 1); } },
    line(x0, y0, x1, y1, col, skip = 0) { g.fillStyle = col; const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0)) | 0; for (let k = 0; k <= n; k++) { if (skip && rng() < skip) continue; g.fillRect(Math.round(lerp(x0, x1, k / n || 0)), Math.round(lerp(y0, y1, k / n || 0)), 1, 1); } },
    rectLine(x, y, w, h, col, skip) { T.line(x, y, x + w, y, col, skip); T.line(x, y + h, x + w, y + h, col, skip); T.line(x, y, x, y + h, col, skip); T.line(x + w, y, x + w, y + h, col, skip); },
    text(str, x, y, col, size = 8, align = 'center') { g.font = `${size}px PS2P, monospace`; g.textAlign = align; g.textBaseline = 'top'; g.fillStyle = col; g.fillText(str, x, y); },
    shadowBand(y, h, a) { const gr = g.createLinearGradient(0, y, 0, y + h); gr.addColorStop(0, `rgba(0,0,0,${a})`); gr.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = gr; g.fillRect(0, y, BG_TW, h); },
    tree(cx, cy, r) {
      T.disc(cx + 4, cy + 5, r, 'rgba(0,0,0,0.25)');
      T.disc(cx, cy, r, '#2f5a26'); T.disc(cx - 2, cy - 2, r - 3, '#3c7030'); T.disc(cx - 4, cy - 4, r - 8, '#4f8a3a');
      for (let k = 0; k < r * 3; k++) { const a = rng() * 6.28, d = rng() * r; T.P(cx + Math.cos(a) * d, cy + Math.sin(a) * d, rng() < .5 ? '#6aa848' : '#28501f'); }
    },
    bag(x, y, col) { T.R(x - 1, y - 1, 9, 8, '#140f0d'); T.R(x, y, 7, 6, col); T.R(x, y, 7, 2, shade(col, .25)); T.R(x + 2, y + 3, 3, 2, shade(col, -.3)); T.R(x + 1, y - 2, 5, 1, '#140f0d'); },
    leaf(x, y) { const col = pick(['#d8822a', '#e8b03a', '#b8501e', '#a8a030']); T.P(x, y, col); T.P(x + 1, y, col); if (rng() < .5) T.P(x, y + 1, shade(col, -.2)); },
  };
  return T;
}

function paintBolzplatz() {
  const T = painter(202), { R, P, rng } = T;

function randomLook(r) {
  r = r || Math.random;
  const pk = a => a[Math.floor(r() * a.length)];
  const hs = r() < 0.06 ? 'irokese' : pk(['kurz', 'kurz', 'stachel', 'locken', 'lang', 'zopf', 'glatze']);
  return { skin: pk(CROWD_SKINS), hair: pk(CROWD_HAIR), hairStyle: hs, top: pk(CROWD_TOPS), topStyle: pk(TOPSTYLES), pants: pk(CROWD_PANTS), shoes: pk(['#5a3418', '#e8e8e8', '#202020', '#a83030']), acc: r() < 0.82 ? 'none' : pk(['cap', 'brille', 'stirnband', 'kopfhoerer', 'bandana']), accCol: pk(['#d8382c', '#2e5ea8', '#e0b030', '#2e8a40']) };
}
const CROWD = [];
(function buildCrowd() {
  const r = mkR(777);
  const add = (n, rad, jit, off) => {
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2 + off + (r() - .5) * 0.08, rr = rad + r() * jit;
      const x = Math.cos(a) * rr, y = Math.sin(a) * rr * 1.02;
      const inward = Math.atan2(-y, -x);
      CROWD.push({ x, y, look: randomLook(r), dir: dirFromAngle(inward), bob: r() * 6.28, spd: 0.6 + r() * 0.9, react: 0, cheerPh: 0, sc: 1.75 + r() * 0.12 });
    }
  };
  add(26, 156, 10, 0.06); add(32, 194, 14, 0.18);
})();
function crowdReact(power, nearX, nearY) {
  CROWD.forEach(m => { const d = nearX === undefined ? 0 : dist(m.x, m.y, nearX, nearY); if (Math.random() < power * (1 - d / 520)) m.react = Math.max(m.react, 18 + Math.random() * 30 | 0); });
}

/* ═══════════════════ AMBIENT PARTICLES ═══════════════════ */
const AMB = [];
function ambientTick(arena, camX, camY) {
  const A = ARENAS[arena].amb; const viewW = W / 1.4, viewH = H / 1.4;
  const max = A === 'flash' ? 6 : 26;
  if (AMB.length < max && Math.random() < 0.25) {
    const x = camX + rnd(-viewW / 2, viewW / 2), y = camY + rnd(-viewH / 2, viewH / 2);
    if (A === 'leaves') AMB.push({ x: camX - viewW / 2 - 10, y: camY + rnd(-viewH / 2, viewH / 3), vx: rnd(0.4, 1.0), vy: rnd(0.15, 0.4), life: 600, max: 600, c: pick(['#d8822a', '#e8b03a', '#b8501e']), w: rnd(0, 6) });
    else if (A === 'pollen') AMB.push({ x, y, vx: rnd(-.15, .15), vy: rnd(-.2, -.05), life: 300, max: 300, c: '#fff4a0', glow: true });
    else if (A === 'dust') AMB.push({ x, y, vx: rnd(.05, .2), vy: rnd(.05, .15), life: 400, max: 400, c: '#fffaf0' });
    else if (A === 'wind') AMB.push({ x: camX - viewW / 2, y, vx: rnd(3, 5), vy: rnd(-.2, .2), life: 120, max: 120, c: 'rgba(255,255,255,0.25)', streak: true });
    else if (A === 'flash' && Math.random() < 0.2) AMB.push({ x: rnd(-240, 240), y: rnd(-430, -320), vx: 0, vy: 0, life: 8, max: 8, c: '#ffffff', flash: true });
  }
  for (let i = AMB.length - 1; i >= 0; i--) {
    const p = AMB[i]; p.life--; p.x += p.vx + (p.w !== undefined ? Math.sin((p.max - p.life) * 0.05 + p.w) * 0.4 : 0); p.y += p.vy;
    if (p.life <= 0) AMB.splice(i, 1);
  }
}
function ambientDraw() {
  for (const p of AMB) {
    const a = Math.min(1, p.life / 40, (p.max - p.life) / 20);
    ctx.globalAlpha = a;
    if (p.streak) { ctx.fillStyle = p.c; ctx.fillRect(p.x | 0, p.y | 0, 18, 1); }
    else if (p.flash) { ctx.fillStyle = '#fff'; ctx.fillRect(p.x - 2, p.y - 2, 4, 4); ctx.globalAlpha = a * 0.3; ctx.fillRect(p.x - 6, p.y - 6, 12, 12); }
    else if (p.glow) { ctx.fillStyle = p.c; ctx.fillRect(p.x | 0, p.y | 0, 2, 2); ctx.globalAlpha = a * 0.25; ctx.fillRect((p.x | 0) - 2, (p.y | 0) - 2, 6, 6); }
    else { ctx.fillStyle = p.c; ctx.fillRect(p.x | 0, p.y | 0, 2, 2); }
  }
  ctx.globalAlpha = 1;
}

/* opponent factory */
function makeOpp(tier, rank, extraScale = 0) {
  const d = OPP_DEF[tier][rank];
  const boss = rank === 5;
  const trait = d[1];
  const sk = clamp(0.18 + tier * 0.15 + rank * 0.03 + (boss ? 0.1 : 0) + extraScale * 0.05, 0.1, 0.97);
  const o = {
    id: tier + '_' + rank, tier, rank, boss, name: d[0], nick: d[4] || '', trait, look: d[2], line: d[3],
    hp: Math.round((95 + tier * 48 + rank * 9 + (boss ? 75 : 0)) * (trait === 'panzer' ? 1.25 : 1) * (1 + extraScale * 0.12)),
    dmg: (0.85 + tier * 0.24 + rank * 0.035 + (boss ? 0.18 : 0)) * (1 + extraScale * 0.06),
    spd: (1 + tier * 0.09 + rank * 0.02) * (trait === 'blitz' ? 1.22 : trait === 'panzer' ? 0.86 : 1),
    tech: clamp(1 - tier * 0.05 - (trait === 'blitz' ? 0.1 : 0), 0.7, 1),
    kbRes: trait === 'panzer' ? 0.45 : boss ? 0.7 : 1,
    skill: sk,
    special: trait === 'techniker' ? 'wirbel' : boss ? ['donner', 'donner', 'wirbel', 'rempler', 'donner'][tier] : (tier >= 2 ? ['wirbel', 'donner', 'rempler'][(tier + rank) % 3] : 'wirbel'),
    scale: boss ? 2.95 : 2.6,
  };
  o.rating = oppRating(o);
  return o;
}
function oppRating(o) { return Math.round(o.hp * 0.25 + o.dmg * 40 + o.spd * 20 + o.skill * 60); }
function playerRating() { const s = save.stats; return Math.round(pMaxHp() * 0.25 + pDmgM() * 40 + pSpd() * 20 + 30 + (s.technik - 1) * 1.6); }

/* player derived stats (levels 1..50) */
const STAT_MAX = 50;
function pMaxHp() { return 100 + (save.stats.ausdauer - 1) * 7; }
function pDmgM() { return 1 + (save.stats.kraft - 1) * 0.045; }
function pSpd() { return 1 + (save.stats.tempo - 1) * 0.012; }
function pTech() { return Math.max(0.68, 1 - (save.stats.technik - 1) * 0.0068); }
function pStaRegen() { return 0.42 + (save.stats.ausdauer - 1) * 0.008; }
function trainCost(stat) { const l = save.stats[stat]; return Math.round(18 + l * 9 + l * l * 0.9); }

};
const DIFF_MULT = [0.65, 1, 1.25];
const COMIC = ['BAM!', 'POW!', 'WUMMS!', 'ZACK!', 'KRACH!', 'BUMM!', 'PENG!'];
let ATK_SEQ = 1;

class Fighter {
  constructor(o) {
    this.isP = !!o.isP; this.look = o.look; this.name = o.name; this.maxHp = o.maxHp;
    this.dmgM = o.dmgM || 1; this.spd = o.spd || 1; this.tech = o.tech || 1; this.kbRes = o.kbRes || 1;
    this.staRegen = o.staRegen || 0.42; this.special = o.special || 'wirbel'; this.scale = o.scale || 2.6; this.boss = !!o.boss;
    this.r = 20; this.hp = this.maxHp; this.pow = o.pow || 0;
    this.reset(this.isP ? -52 : 52, 0);
  }
  reset(x, y) {
    this.x = x; this.y = y; this.vx = 0; this.vy = 0; this.ang = this.isP ? 0 : Math.PI;
    this.dispHp = this.hp; this.sta = 100;
    this.st = 'idle'; this.mv = null; this.mvId = ''; this.ph = ''; this.pt = 0; this.atkId = 0; this.hitDone = false; this.perfectDone = false;
    this.hurtT = 0; this.dizzyT = 0; this.dizzyCool = 0; this.frozenT = 0; this.dodgeT = 0; this.iframe = 0; this.inv = 0;
    this.combo = 0; this.comboT = 0; this.comboPop = 0; this.hitLog = [];
    this.speedT = 0; this.armorT = 0; this.chili = false; this.enraged = false; this.usedHeal = false;
    this.walkAcc = 0; this.ghosts = []; this.spinA = 0; this.winT = 0; this.landT = 0;
    this.stat = { hits: 0, kicks: 0, maxCombo: 0, perfects: 0, counters: 0, specialHits: 0, dmgTaken: 0, items: 0 };
  }
  get down() { return this.st === 'down'; }
  canAct() { return this.st === 'idle'; }
  attack(id) {
    if (!this.canAct()) return false;
    const mv = MOVES[id]; if (!mv) return false;
    if (mv.kind === 'special') { if (this.pow < 100) return false; this.pow = 0; }
    this.st = 'atk'; this.mv = mv; this.mvId = id; this.ph = 'su'; this.atkId = ATK_SEQ++;
    this.pt = Math.max(3, Math.round(mv.su * this.tech)); this.hitDone = false; this.perfectDone = false; this.spinA = 0;
    if (mv.kind === 'special') { sfx.charge(); Fight.onSpecialStart(this); } else sfx.swing();
    return true;
  }
  dodge(dx, dy) {
    const inRec = this.st === 'atk' && this.ph === 're';
    if (!(this.st === 'idle' || inRec)) return false;
    const cost = inRec ? 40 : 25;
    if (this.sta < cost) { if (this.isP) Fight.flashSta = 20; return false; }
    this.sta -= cost;
    let l = Math.hypot(dx, dy);
    if (l < 0.3) { dx = -Math.cos(this.ang); dy = -Math.sin(this.ang); l = 1; }
    dx /= l; dy /= l;
    const imp = 7.6 * (0.9 + this.spd * 0.1);
    this.vx = dx * imp; this.vy = dy * imp;
    this.st = 'dodge'; this.dodgeT = 16; this.iframe = 11; this.mv = null;
    sfx.whoosh(); Fight.dust(this.x, this.y, 5);
    return true;
  }
  update(foe) {
    // ghosts
    for (let i = this.ghosts.length - 1; i >= 0; i--) if (--this.ghosts[i].life <= 0) this.ghosts.splice(i, 1);
    if (this.st === 'down') { this.vx *= 0.88; this.vy *= 0.88; this.x += this.vx; this.y += this.vy; this.bound(); return; }
    if (this.st === 'win') { this.winT++; this.vx *= 0.8; this.vy *= 0.8; return; }
    // timers
    if (this.inv > 0) this.inv--;
    if (this.iframe > 0) this.iframe--;
    if (this.comboT > 0 && --this.comboT === 0) this.combo = 0;
    if (this.comboPop > 0) this.comboPop--;
    if (this.speedT > 0) this.speedT--;
    if (this.armorT > 0) this.armorT--;
    if (this.dizzyCool > 0) this.dizzyCool--;
    const regen = this.staRegen * (this.speedT > 0 ? 2 : 1);
    if (this.st !== 'dodge') this.sta = Math.min(100, this.sta + regen);
    // facing
    const ta = Math.atan2(foe.y - this.y, foe.x - this.x);
    let turn = 0;
    if (this.st === 'idle') turn = 0.22; else if (this.st === 'atk') turn = this.ph === 'su' ? 0.14 : this.ph === 're' ? 0.05 : 0;
    this.ang += normA(ta - this.ang) * turn;
    // states
    switch (this.st) {
      case 'atk': {
        const mv = this.mv;
        if (this.ph === 'su' && this.mvId === 'donner' && this.pt % 4 === 0) Fight.chargeFx(this);
        if (--this.pt <= 0) {
          if (this.ph === 'su') {
            this.ph = 'ac'; this.pt = mv.ac;
            if (mv.lunge) { this.vx += Math.cos(this.ang) * mv.lunge; this.vy += Math.sin(this.ang) * mv.lunge; }
            Fight.swoosh(this, mv);
            if (mv.kind === 'special') sfx.special();
          } else if (this.ph === 'ac') {
            if (!this.hitDone && mv.kind !== 'special') this.missT = 10;
            this.ph = 're'; this.pt = Math.max(4, Math.round(mv.re * this.tech) + (this.hitDone ? 0 : 4));
          } else { this.st = 'idle'; this.mv = null; this.ph = ''; }
        }
        if (this.ph === 'ac' && mv.dash) {
          this.vx = Math.cos(this.ang) * mv.dash; this.vy = Math.sin(this.ang) * mv.dash;
          if (t % 2 === 0) this.ghosts.push({ x: this.x, y: this.y, life: 10, dir: dirFromAngle(this.ang), pose: 'dash' });
          if (t % 3 === 0) Fight.dust(this.x, this.y, 1);
        }
        if (this.ph === 'ac' && mv.spin) { this.spinA += (Math.PI * 2) / mv.ac * 1.6; if (t % 2 === 0) this.ghosts.push({ x: this.x, y: this.y, life: 8, dir: dirFromAngle(this.ang + this.spinA), pose: 'kickA' }); }
        break;
      }
      case 'dodge':
        if (t % 2 === 0) this.ghosts.push({ x: this.x, y: this.y, life: 9, dir: dirFromAngle(this.ang), pose: 'dodge' });
        if (--this.dodgeT <= 0) this.st = 'idle';

/* ═══════════════════════════════════════════════════════════════
   06 MODES & PROGRESSION: coins/xp, achievements, quests, daily,
   career, tournament, marathon, sparring, training minigames
   ═══════════════════════════════════════════════════════════════ */
function addCoins(n) { n = Math.round(n); if (n <= 0) return 0; save.coins += n; save.earned += n; return n; }
let pendingLevelUps = [];
function addXP(n) {
  save.xp += Math.round(n);
  while (save.xp >= xpForLevel(save.level)) {
    save.xp -= xpForLevel(save.level); save.level++;
    const coins = 40 + save.level * 25; addCoins(coins);
    pendingLevelUps.push({ level: save.level, coins, title: titleFor(save.level), newTitle: TITLES.some(x => x[0] === save.level) });
  }
}
function checkAch() {
  const got = [];
  for (const [id, name, desc, coins, cond] of ACH) {
    if (save.ach[id]) continue;
    try { if (cond(save)) { save.ach[id] = true; addCoins(coins); got.push({ id, name, coins }); } } catch (e) { }
  }
  if (got.length) { persist(); got.forEach((a, i) => setTimeout(() => UI.toast('ERFOLG: ' + a.name, '+' + a.coins + ' Münzen', 'medal'), 400 + i * 1600)); }
  return got;
}
/* ── daily quests ── */
function ensureQuests() {
  const d = todayStr();
  if (save.quests.date === d) return;
  const r = mkR(hashStr(d + (save.name || '')));
  const pool = QUEST_POOL.slice(); const list = [];
  while (list.length < 3) { const q = pool.splice(Math.floor(r() * pool.length), 1)[0]; list.push({ id: q[0], txt: q[1], goal: q[2], coins: q[3], prog: 0, done: false, claimed: false }); }
  save.quests = { date: d, list, chest: false }; persist();
}
function questProg(id, n) {
  ensureQuests();
  for (const q of save.quests.list) {
    if (q.id !== id || q.done) continue;
    q.prog = Math.min(q.goal, q.prog + n);
    if (q.prog >= q.goal) { q.done = true; setTimeout(() => UI.toast('AUFGABE ERLEDIGT!', q.txt, 'scroll'), 300); }
  }
}
function questsClaimable() { ensureQuests(); return save.quests.list.filter(q => q.done && !q.claimed).length + (save.quests.list.every(q => q.claimed) && !save.quests.chest ? 1 : 0); }
/* ── daily bonus ── */
function dailyAvailable() { return save.daily.last !== todayStr(); }
function claimDaily() {
  const d = todayStr(); if (save.daily.last === d) return null;
  const consec = save.daily.last && dayDiff(save.daily.last, d) === 1;
  save.daily.day = consec ? (save.daily.day % 7) + 1 : 1;
  save.daily.streak = consec ? (save.daily.streak || 0) + 1 : 1;
  save.daily.best = Math.max(save.daily.best || 0, save.daily.streak);
  save.daily.last = d;
  const [c, item] = DAILY_REWARDS[save.daily.day - 1];
  if (c) addCoins(c); if (item) save.items[item] = (save.items[item] || 0) + 1;
  persist(); checkAch();
  return { day: save.daily.day, coins: c, item };
}

/* ── shared reward computation ── */
function fightRewards(res, opp, kind) {
  const lines = []; let total = 0;
  const add = (label, v) => { v = Math.round(v); if (v > 0) { lines.push([label, v]); total += v; } };
  if (res.won) {
    let base = kind === 'free' ? 15 + opp.tier * 14 : 30 + opp.tier * 32 + opp.rank * 7;
    if (opp.boss && kind !== 'free') base *= 2.5;
    if (kind === 'marathon') base = 14 + opp.tier * 10;
    add('SIEGPRÄMIE', base);
    add('TREFFER x' + res.hits, res.hits);
    add('BESTE KOMBO x' + res.maxCombo, res.maxCombo * 3);
    add('PERFEKT AUSGEWICHEN', res.perfects * 6);
    add('KONTER', res.counters * 3);
    if (res.ko) add('K.O.-BONUS', 15 + opp.tier * 5);
    if (res.flawless) add('UNBERÜHRT!', 40 + opp.tier * 10);
    if (save.streak >= 2) add('SIEGESSERIE x' + save.streak, Math.min(60, save.streak * 6));
  } else add('TROSTPREIS', 10 + opp.tier * 6);
  if (save.upgrades.kleeblatt && total) { const b = Math.round(total * 0.2); lines.push(['GLÜCKSKLEE +20%', b]); total += b; }
  const xp = res.won ? (40 + opp.tier * 22 + opp.rank * 4) * (opp.boss ? 2 : 1) : 15 + opp.tier * 6;
  return { lines, total, xp: Math.round(kind === 'free' ? xp * 0.6 : xp) };
}
function applyFightStats(res) {
  save.rec.fights++;
  if (res.won) { save.rec.wins++; save.streak++; save.rec.bestStreak = Math.max(save.rec.bestStreak, save.streak); if (res.ko) { save.rec.ko++; questProg('ko2', 1); } questProg('win3', 1); if (res.hpPct > 0.7) questProg('hp70', 1); if (res.flawless) save.rec.flawless++; }
  else { save.rec.losses++; save.streak = 0; }
  save.rec.bestCombo = Math.max(save.rec.bestCombo, res.maxCombo);
  save.rec.perfects += res.perfects; save.rec.counters += res.counters; save.rec.specialHits += res.specialHits;
  if (res.specialKO && res.won) save.rec.specialKO++;
}

/* ═══ CAREER ═══ */
const Career = {
  opp() { const def = save.ladder >= 6; return makeOpp(save.tier, def ? 5 : save.ladder, def ? 1 + (save.defenses || 0) * 0.6 : 0); },
  start(loadout) {

    Game.startFight({ mode: o.boss ? 'boss' : 'career', opp: o, rounds: o.boss ? 2 : 1, time: 60, loadout, title: o.boss ? 'BOSSKAMPF' : 'LIGAKAMPF', onEnd: res => this.end(res, o) });
  },

    let promo = false, champ = false, defended = false;
    if (res.won) {
      if (save.ladder < 6) { save.ladder++; if (save.ladder === 6) { if (save.tier < 4) promo = true; else { champ = !save.champion; save.champion = true; } } }
      else { save.defenses = (save.defenses || 0) + 1; defended = true; const b = addCoins(300 + save.defenses * 50); rw.lines.push(['TITEL VERTEIDIGT', b]); rw.total += b; }
    }
    persist(); checkAch();
    UI.result({ res, opp: o, rw, kind: 'career', promo, champ, defended });
  },
  promote() {
    const bonus = 150 + save.tier * 120; addCoins(bonus);

  },

/* ═══ TOURNAMENT ═══ */
const Tourney = {
  st: null,
  fee(tier) { return 50 + tier * 60; },
  prize(tier) { return Math.round(220 * (tier + 1) * Math.pow(1.3, tier)); },
  start(tier) {
    const fee = this.fee(tier); if (save.coins < fee) return false;
    save.coins -= fee; persist();
    const ents = [{ me: true, name: save.name || 'DU', look: save.look, rating: playerRating() }];
    for (let r = 0; r < 6; r++) { const o = makeOpp(tier, r); ents.push({ opp: o, name: o.name, look: o.look, rating: o.rating }); }
    const nt = tier > 0 ? tier - 1 : 1; const o2 = makeOpp(nt, 4); ents.push({ opp: o2, name: o2.name, look: o2.look, rating: o2.rating });
    // shuffle all but keep player at slot 0
    const rest = ents.slice(1).sort(() => Math.random() - 0.5);
    this.st = { tier, rounds: [[ents[0], ...rest]], round: 0, out: false, won: false };
    return true;
  },
  myOpp() { const R = this.st.rounds[this.st.round]; const i = R.findIndex(e => e.me); return R[i % 2 ? i - 1 : i + 1]; },
  fight(loadout) {
    const e = this.myOpp(); const names = ['VIERTELFINALE', 'HALBFINALE', 'FINALE'];
    Game.startFight({ mode: 'tourney', opp: e.opp, rounds: 1, time: 45, loadout, title: names[this.st.round], onEnd: res => this.end(res, e) });
  },
  end(res, e) {
    applyFightStats(res);
    const S = this.st, R = S.rounds[S.round], next = [];
    for (let i = 0; i < R.length; i += 2) {
      const a = R[i], b = R[i + 1];
      if (a.me || b.me) next.push(res.won ? (a.me ? a : b) : (a.me ? b : a));
      else { const pa = a.rating / (a.rating + b.rating); next.push(Math.random() < pa ? a : b); }
    }
    S.lastRes = res;
    let coins = 0, xp = 0;
    if (!res.won) { S.out = true; coins = [20, 60, 140][S.round] * (S.tier + 1); xp = 20 + S.round * 15; }
    else if (S.round === 2) { S.won = true; coins = this.prize(S.tier); xp = 120 + S.tier * 50; save.trophies[S.tier]++; save.rec.cups++; }
    else { coins = 10 + S.tier * 8 + res.hits; xp = 25 + S.tier * 8; }
    if (save.upgrades.kleeblatt) coins = Math.round(coins * 1.2);
    addCoins(coins); addXP(xp);
    S.rounds.push(next); if (res.won && S.round < 2) S.round++;
    if (!res.won) { let cur = next; while (cur.length > 1) { const nx = []; for (let i = 0; i < cur.length; i += 2) { const a = cur[i], b = cur[i + 1]; nx.push(Math.random() < a.rating / (a.rating + b.rating) ? a : b); } S.rounds.push(nx); cur = nx; } }

/* ═══ CANVAS INPUT ═══ */
function toCanvas(e) { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * W / r.width, (e.clientY - r.top) * H / r.height]; }
function resetJoy() { JOY.active = false; JOY.pid = -1; JOY.dx = 0; JOY.dy = 0; for (const k in PTR) delete PTR[k]; }
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); initAudio();
  const [x, y] = toCanvas(e);
  if (Game.mode === 'mini') { Mini.tap(x, y); return; }
  if (Game.mode !== 'fight' || !Fight.active || Fight.paused) return;
  if (dist(x, y, PAUSE_BTN.x, PAUSE_BTN.y) < 28) { UI.pause(); return; }
  for (let i = 0; i < Fight.loadout.length; i++) { const s = ITEM_SLOTS[i]; if (dist(x, y, s.x, s.y) < s.r * 1.45) { Fight.useItem(i); return; } }
  let best = null, bd = 1e9;
  for (const id in BTN) { const b = BTN[id]; const d = dist(x, y, b.x, b.y); if (d < b.r * 1.32 && d < bd) { bd = d; best = id; } }
  if (best) { PTR[e.pointerId] = { role: 'btn', id: best }; PTR_BTN[best]++; Fight.press(best); buzz(6); return; }
  if (!JOY.active && x < W * 0.6 && y > H * 0.3) {
    JOY.active = true; JOY.pid = e.pointerId; JOY.cx = x; JOY.cy = y; JOY.kx = x; JOY.ky = y; JOY.dx = 0; JOY.dy = 0;
    PTR[e.pointerId] = { role: 'joy' };
    try { cv.setPointerCapture(e.pointerId); } catch (err) { }
  }
}, { passive: false });
cv.addEventListener('pointermove', e => {
  const p = PTR[e.pointerId]; if (!p || p.role !== 'joy') return;
  e.preventDefault();
  const [x, y] = toCanvas(e);
  let dx = x - JOY.cx, dy = y - JOY.cy, d = Math.hypot(dx, dy);
  if (d > JOY.R) { const k = (d - JOY.R) / d; JOY.cx += dx * k; JOY.cy += dy * k; dx = x - JOY.cx; dy = y - JOY.cy; d = JOY.R; }
  JOY.kx = JOY.cx + dx; JOY.ky = JOY.cy + dy;
  const m = d / JOY.R; const dz = 0.14;
  if (m < dz) { JOY.dx = 0; JOY.dy = 0; } else { const mm = Math.min(1, (m - dz) / (1 - dz)); JOY.dx = dx / d * mm; JOY.dy = dy / d * mm; }
}, { passive: false });
function ptrEnd(e) {
  const p = PTR[e.pointerId]; if (!p) return;
  if (p.role === 'joy') { JOY.active = false; JOY.pid = -1; JOY.dx = 0; JOY.dy = 0; }
  if (p.role === 'btn') PTR_BTN[p.id] = Math.max(0, PTR_BTN[p.id] - 1);
  delete PTR[e.pointerId];
}
cv.addEventListener('pointerup', ptrEnd); cv.addEventListener('pointercancel', ptrEnd); cv.addEventListener('lostpointercapture', ptrEnd);
document.addEventListener('contextmenu', e => e.preventDefault());

/* keyboard (desktop testing) */
document.addEventListener('keydown', e => {

  initAudio();

/* ═══ LOOP ═══ */
const STEP = 1000 / 60; let acc = 0, lastT = performance.now();
function tick() {
  t++;
  if (Game.mode === 'fight') Fight.update();
  else if (Game.mode === 'mini') Mini.update();
  else if (Game.mode === 'post') Fight.postTick();
  MenuScene.tick();
}
function render() {
  ctx.imageSmoothingEnabled = false;
  if (Game.mode === 'fight' || Game.mode === 'post') Fight.render();
  else { MenuScene.render(); if (Game.mode === 'mini') Mini.render(); if (Game.mode === 'vs') { ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(0, 0, W, H); } }
}
function frame(now) {
  requestAnimationFrame(frame);
  acc += Math.min(120, now - lastT); lastT = now;
  let n = 0; while (acc >= STEP && n < 5) { tick(); acc -= STEP; n++; }
  if (n >= 5) acc = 0;
  try { render(); } catch (err) { console.error(err); }
}

  try { const SB = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.StatusBar; if (SB && window.Capacitor.isNativePlatform()) { SB.hide(); } } catch (e) { }
  UI.title();
  requestAnimationFrame(frame);
  window.__SB = { Game, Fight, UI, save: () => save, Career, Tourney, Marathon, Mini };
})();
const _origBanners = Fight.drawBanners;
Fight.drawBanners = function () { if (Game.mode === 'fight') _origBanners.call(this); };

/* iOS Safari: stop page scroll/bounce/double-tap zoom while tapping fast */
(function iosLock() {
  const allowScroll = el => el && el.closest && el.closest('.scroll,.dlg,.chips');
  document.addEventListener('touchmove', e => { if (!allowScroll(e.target)) e.preventDefault(); }, { passive: false });
  ['touchstart', 'touchend', 'touchmove'].forEach(ev => cv.addEventListener(ev, e => e.preventDefault(), { passive: false }));
  let lastEnd = 0;
  document.addEventListener('touchend', e => { const n = Date.now(); if (n - lastEnd < 350 && !allowScroll(e.target) && e.target.tagName !== 'INPUT') e.preventDefault(); lastEnd = n; }, { passive: false });
  document.addEventListener('gesturestart', e => e.preventDefault(), { passive: false });
  document.addEventListener('dblclick', e => e.preventDefault(), { passive: false });
  const fix = () => { if (window.scrollX || window.scrollY) window.scrollTo(0, 0); };
  window.addEventListener('scroll', fix, { passive: true });
  if (window.visualViewport) { window.visualViewport.addEventListener('resize', () => { fix(); resize(); }); window.visualViewport.addEventListener('scroll', fix); }
})();
